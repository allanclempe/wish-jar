# The API (apps/api, WJ-41) runs on Cloudflare Workers, apart from the site
# (site.yml). Pull requests that touch it or the jar types it shares with the
# app (packages/jar) run its checks; merges to main also deploy it, its WAF
# rules first (apps/api/scripts/waf.ts, WJ-70). The
# deploy job reads the secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
# Account Settings: Read, and on the blastin.dev zone: Workers Routes: Edit,
# DNS: Edit, Zone: Read, Zone WAF: Edit) and the variables
# CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_ZONE_ID from the "production"
# environment. The Worker's secrets TURNSTILE_SECRET_KEY (WJ-54) and
# SIGNING_KEY (WJ-55) are secrets there too, uploaded with each deploy.
name: API

on:
  pull_request:
    paths: &paths ['apps/api/**', 'packages/jar/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/api.yml']
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The API's packages only, not the app's.
      - run: pnpm install --frozen-lockfile --filter @wish-jar/api...
      - run: pnpm run typecheck
      - run: pnpm test

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and never cancel one halfway.
    concurrency:
      group: api-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The API's packages only, not the app's.
      - run: pnpm install --frozen-lockfile --filter @wish-jar/api...
      # Before the Worker, so a route it now serves isn't blocked at the edge.
      - run: pnpm run waf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      # The secrets go up with the version that needs them. An upload only adds
      # or changes, so a secret gone from GitHub keeps its last value in
      # Cloudflare; an empty one stops the deploy instead of breaking the
      # Turnstile check or every signed token.
      - run: |
          for name in TURNSTILE_SECRET_KEY SIGNING_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the \"production\" environment"
              exit 1
            fi
          done
          umask 077
          jq -n '{TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY, SIGNING_KEY: env.SIGNING_KEY}' > "$RUNNER_TEMP/api-secrets.json"
          pnpm run deploy --secrets-file "$RUNNER_TEMP/api-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
