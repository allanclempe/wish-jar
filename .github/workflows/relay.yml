# The photo relay (relay/, WJ-41) runs on Cloudflare Workers, apart from the
# site (site.yml). Pull requests that touch it run its checks; merges to
# main also deploy it, its WAF rules first (relay/scripts/waf.ts, WJ-70). The
# deploy job reads the secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
# Account Settings: Read, and on the blastin.dev zone: Workers Routes: Edit,
# DNS: Edit, Zone: Read, Zone WAF: Edit) and the variables
# CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_ZONE_ID from the "production"
# environment.
name: Photo relay

on:
  pull_request:
    paths: ['relay/**', '.github/workflows/relay.yml']
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: relay

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and never cancel one halfway.
    concurrency:
      group: photo-relay-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Before the Worker, so a route it now serves isn't blocked at the edge.
      - run: pnpm run waf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
