# The photo relay (relay/, WJ-41) runs on Cloudflare Workers, apart from the
# site that EAS deploys. Pull requests that touch it run its checks; merges to
# main also deploy it. The deploy job reads the secret CLOUDFLARE_API_TOKEN
# (Workers Scripts: Edit, Account Settings: Read) and the variable
# CLOUDFLARE_ACCOUNT_ID from the repository's "production" environment.
name: Photo relay

on:
  pull_request:
    paths: ['relay/**', '.github/workflows/relay.yml']
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: relay

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and never cancel one halfway.
    concurrency:
      group: photo-relay-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
