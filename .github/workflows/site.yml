# The web site runs on Cloudflare Workers (wrangler.jsonc, WJ-63). Pull
# requests run its checks and the export; merges to main also deploy it. The
# deploy job reads the same secret and variable as relay.yml, from the
# "production" environment; the token's DNS and Workers Routes permissions on
# the blastin.dev zone cover wish-jar-app.blastin.dev.
name: Site

on:
  pull_request:
    paths-ignore: ['relay/**', 'frame/**', '.github/workflows/relay.yml']
  push:
    branches: [main]
    paths-ignore: ['relay/**', 'frame/**', '.github/workflows/relay.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec expo export -p web
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and never cancel one halfway.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - run: npx --yes wrangler@4.151.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
