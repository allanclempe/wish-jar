# The web site runs on Cloudflare Workers (apps/mobile/wrangler.jsonc,
# WJ-63). Pull requests run its checks and the export; merges to main also
# deploy it. The deploy job reads the same secret and variable as api.yml,
# from the "production" environment; the token's DNS and Workers Routes
# permissions on the blastin.dev zone cover wish-jar.blastin.dev.
name: Site

on:
  pull_request:
    paths-ignore: &paths-ignore ['apps/api/**', 'apps/frame/**', '.github/workflows/api.yml']
  push:
    branches: [main]
    paths-ignore: *paths-ignore
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The app's packages only, not the API's.
      - run: pnpm install --frozen-lockfile --filter @wish-jar/mobile...
      - run: pnpm exec expo lint
      - run: pnpm exec tsc --noEmit
      # The Turnstile widget's site key (src/family/turnstile.ts), a
      # repository variable: it isn't a secret, and an export without it
      # couldn't start a family.
      - name: Export
        env:
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          test -n "$EXPO_PUBLIC_TURNSTILE_SITE_KEY" || { echo "Set the TURNSTILE_SITE_KEY repository variable" >&2; exit 1; }
          pnpm exec expo export -p web
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/mobile/dist
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and never cancel one halfway.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: apps/mobile/dist
      - run: npx --yes wrangler@4.151.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
