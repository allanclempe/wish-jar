<?xml version="1.0" encoding="UTF-8"?>
<!-- Wish Jar's icon (WJ-77): the coin jar from src/components/CoinJar.tsx,
     simplified to read at favicon size: a short, wide jar with its lid on, a
     few big coins and a grin. On a transparent background; icons.sh puts it
     on the icon's background at every size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 2 112 116" width="112" height="116">
  <defs>
    <clipPath id="body">
      <rect x="10" y="34" width="100" height="78" rx="24"/>
    </clipPath>
  </defs>

  <!-- The glass, and the coins in it. -->
  <rect x="10" y="34" width="100" height="78" rx="24" fill="#E8F7FD"/>
  <g clip-path="url(#body)" stroke="#E0A800" stroke-width="5" fill="#FFC93C">
    <ellipse cx="34" cy="104" rx="20" ry="11"/>
    <ellipse cx="86" cy="104" rx="20" ry="11"/>
    <ellipse cx="60" cy="98" rx="20" ry="11"/>
  </g>

  <!-- The outline and grin over the coins. -->
  <rect x="10" y="34" width="100" height="78" rx="24" fill="none" stroke="#3D2C2E" stroke-width="6"/>
  <g fill="none" stroke="#3D2C2E" stroke-width="6" stroke-linecap="round">
    <path d="M36 60 q7 -9 14 0"/>
    <path d="M70 60 q7 -9 14 0"/>
  </g>
  <path d="M46 70 q14 15 28 0 z" fill="#3D2C2E" stroke="#3D2C2E" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="28" cy="72" r="6" fill="#FF9EB5"/>
  <circle cx="92" cy="72" r="6" fill="#FF9EB5"/>

  <!-- The lid, on. -->
  <rect x="16" y="8" width="88" height="22" rx="9" fill="#FF8A3D" stroke="#3D2C2E" stroke-width="6"/>
</svg>
